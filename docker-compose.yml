services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: estategpt
      MYSQL_USER: estategpt
      MYSQL_PASSWORD: estategpt-local-password
      MYSQL_ROOT_PASSWORD: root-local-password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  api:
    build:
      context: ./server
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_NAME: estategpt
      DB_USER: estategpt
      DB_PASSWORD: estategpt-local-password
      JWT_SECRET: local-development-secret-change-me
      CORS_ORIGIN: http://localhost:8081
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:5000/api
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  mysql-data:
